<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Opening your link…</title>
<style>
:root{--bg1:#4f46e5;--bg2:#06b6d4}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff;
 background:linear-gradient(135deg,var(--bg1),var(--bg2));background-size:200% 200%;animation:flow 12s ease infinite;
 display:flex;align-items:center;justify-content:center;padding:max(1.2rem,env(safe-area-inset-top)) max(1.2rem,env(safe-area-inset-right)) max(1.2rem,env(safe-area-inset-bottom)) max(1.2rem,env(safe-area-inset-left))}
@keyframes flow{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
.card{width:100%;max-width:400px;text-align:center;padding:2.4rem 1.8rem;border-radius:24px;background:rgba(255,255,255,.14);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.25);box-shadow:0 20px 60px rgba(0,0,0,.25)}
.spinner{width:64px;height:64px;margin:0 auto 1.4rem;border-radius:50%;border:5px solid rgba(255,255,255,.3);border-top-color:#fff;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.icon{font-size:3rem;margin-bottom:1rem;display:none}
h1{font-size:1.5rem;margin:0 0 .5rem}
p{margin:.3rem 0;opacity:.9;line-height:1.5}
.dest{display:inline-block;margin-top:.8rem;padding:.35rem .8rem;border-radius:999px;background:rgba(0,0,0,.2);font-size:.9rem;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{display:none;margin-top:1.4rem;padding:.8rem 1.6rem;border-radius:12px;background:#fff;color:#4338ca;font-weight:700;text-decoration:none}

html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh;overflow-x:hidden}
h1,p,.t,.h,.dest{overflow-wrap:anywhere}
@media(max-width:360px){.card{padding:1.8rem 1.2rem}}
@media(min-width:900px){h1{font-size:2rem}}
@media(max-height:480px){body{align-items:flex-start}.card{padding:1.2rem}.spinner{width:42px;height:42px;margin-bottom:.8rem}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="card">
  <div class="spinner" id="spin"></div>
  <div class="icon" id="icon">😕</div>
  <h1 id="title">Opening your link…</h1>
  <p id="sub">Please wait a moment.</p>
  <span class="dest" id="dest" style="display:none"></span><br>
  <a class="btn" id="btn" href="#">Open link now</a>
</main>
<script>
const ID = "1";
const $=id=>document.getElementById(id);
fetch("link.json?t="+Date.now(),{cache:"no-store"})
 .then(r=>{if(!r.ok)throw 0;return r.json()})
 .then(d=>{
   const u=new URL(d[ID]);
   if(!/^https?:$/.test(u.protocol))throw 0;
   $("dest").textContent=u.hostname;$("dest").style.display="inline-block";
   $("sub").textContent="Taking you to:";
   $("btn").href=u.href;
   setTimeout(()=>{$("btn").style.display="inline-block";$("sub").textContent="Not redirected yet? Tap below."},3500);
   setTimeout(()=>location.replace(u.href),600);
 })
 .catch(()=>{
   $("spin").style.display="none";$("icon").style.display="block";
   $("title").textContent="No link set yet";
   $("sub").textContent="Please check back soon.";
 });
</script>
</body>
</html>
